name: Fabric CD Promotion

on:
  push:
    branches: [dev, test]
  workflow_dispatch:
    inputs:
      target:
        description: Target environment
        required: true
        type: choice
        options: [test, prod]

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  promote:
    name: Promote Fabric definitions
    runs-on: ubuntu-latest
    steps:
      - name: Determine promotion path
        id: route
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="${{ inputs.target }}"
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            target="test"
          else
            target="prod"
          fi
          if [[ "$target" == "test" ]]; then source="dev"; else source="test"; fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Create promotion pull request
        id: pr
        shell: bash
        env:
          SOURCE: ${{ steps.route.outputs.source }}
          TARGET: ${{ steps.route.outputs.target }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$TARGET" --head "$SOURCE" --state open --json number --jq '.[0].number')
          if [[ -z "$pr" ]]; then
            pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$TARGET" --head "$SOURCE" --title "deploy: promote $SOURCE to $TARGET" --body "Automated promotion created after a successful change in $SOURCE. Review the Fabric definitions and required CI checks before approval.")
            pr=${pr##*/}
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      - name: Enable automatic merge after approval
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash